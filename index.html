const canvas=document.getElementById('map'),ctx=canvas.getContext('2d'),msg=document.getElementById('msg');
let mode=null,items=[],history=[];
const colors={"Vendor":"#f3ca23","Food truck":"#d73e34","SWC":"#ff8a26","Sponsor":"#292929","Nonprofit":"#ffffff","Kids":"#e77bc0","Main entrance":"#37a8f1","Vendor entrance":"#904fd7","Common area":"#47a55a"};
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);if(img.complete&&img.naturalWidth)ctx.drawImage(img,0,0,canvas.width,canvas.height);
items.forEach((it,i)=>{let x=it.x*canvas.width,y=it.y*canvas.height;
ctx.beginPath();ctx.arc(x,y,18,0,Math.PI*2);ctx.fillStyle=colors[it.kind];ctx.fill();ctx.lineWidth=3;ctx.strokeStyle="#172319";ctx.stroke();
ctx.font="bold 21px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle=it.kind==="Sponsor"?"white":"black";ctx.fillText(String(i+1),x,y);
ctx.font="bold 20px system-ui";let label=it.kind;let w=ctx.measureText(label).width+16;
let lx=Math.max(0,Math.min(canvas.width-w,x-w/2)),ly=y+22;
ctx.fillStyle="rgba(255,255,255,.93)";ctx.fillRect(lx,ly,w,29);ctx.fillStyle="#132d1c";ctx.fillText(label,lx+w/2,ly+15);
});}
img.onload=draw;draw();
document.querySelectorAll('[data-kind]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(z=>z.classList.toggle('active',z===b));msg.textContent=mode==="Erase"?"Tap a marker on the photo to remove it.":"Now tap the photo where you want: "+mode;document.getElementById('map').scrollIntoView({block:"start",behavior:"smooth"});}));
canvas.addEventListener('click',e=>{if(!mode){msg.textContent="Choose an Add button first.";return}
let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
history.push(JSON.stringify(items));
if(mode==="Erase"){let nearest=-1,dist=Infinity;items.forEach((it,i)=>{let d=Math.hypot((it.x-x)*canvas.width,(it.y-y)*canvas.height);if(d<dist){dist=d;nearest=i}});if(nearest>=0)items.splice(nearest,1);}
else items.push({kind:mode,x,y});draw();msg.textContent="Placed! Tap the photo again to add another "+mode+" or choose another button.";});
document.getElementById('undo').onclick=()=>{if(history.length){items=JSON.parse(history.pop());draw()}};
document.getElementById('clear').onclick=()=>{if(confirm("Remove all markers?")){history.push(JSON.stringify(items));items=[];draw()}};
document.getElementById('save').onclick=()=>{draw();const a=document.createElement('a');a.download="Legacy_Festival_My_Layout.png";a.href=canvas.toDataURL('image/png');a.click()};
</script></body></html>
